<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Batch Brew — Swipe Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="page">
  <main class="phone" id="phone">
    <div class="statusbar"><span>9:41</span><span class="status-icons">● ◔ 100%</span></div>

    <section class="screen" id="screen-product">
      <header class="topbar">
        <button class="brand" id="btn-back" aria-label="Back"><span class="brand-mark">☕</span><span><b>Batch Brew</b><small>Specialty Coffee</small></span></button>
        <div class="top-actions">
          <button class="glass-btn" aria-label="Search">⌕</button>
          <button class="glass-btn cart-button" id="btn-cart" aria-label="Cart">♧<span class="badge" id="cart-badge" hidden>0</span></button>
        </div>
      </header>

      <div class="menu-head">
        <div><span class="kicker">DISCOVER</span><h1>Choose your coffee</h1></div>
        <div class="counter" id="product-counter">01 / 06</div>
      </div>

      <div class="swipe-stage" id="swipe-stage" aria-label="Swipe up or down to browse coffees">
        <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
        <div class="deck" id="product-deck"></div>
        <div class="swipe-hint"><span class="arrow">↕</span><span>Swipe<br>up / down</span></div>
      </div>

      <div class="details" id="details">
        <div class="product-number" id="detail-number">02</div>
        <h2 id="detail-name">Iced Americano</h2>
        <p id="detail-desc">Bold, smooth, and refreshing.</p>
        <div class="price" id="detail-price">₱120</div>

        <div class="purchase-row">
          <div class="sizes" id="sizes"></div>
          <button class="add-circle" id="btn-add" aria-label="Add to cart">+</button>
        </div>
      </div>

      <div class="orderbar">
        <div class="stepper">
          <button class="step" id="qty-minus">−</button><span id="qty-val">1</span><button class="step" id="qty-plus">+</button>
        </div>
        <button class="addbtn" id="btn-add-bottom"><span id="addbtn-label">Add to cart · ₱150</span><span>→</span></button>
      </div>
    </section>

    <section class="screen hidden" id="screen-cart">
      <header class="topbar cart-topbar"><button class="glass-btn" id="btn-toproduct">‹</button><h2>My order</h2><span></span></header>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-empty hidden" id="cart-empty">Your cart is empty.</div>
      <div class="checkout-wrap hidden" id="checkout-wrap"><div class="row"><span>Subtotal</span><span id="subtotal">₱0</span></div><div class="row"><span>Service fee</span><span>₱0</span></div><button class="addbtn" id="btn-checkout">Checkout · <span id="checkout-total">₱0</span></button></div>
    </section>
  </main>
</div>
<script src="./script.js"></script>
</body>
</html>
